# Explicit kind renames for the molbio 1 -> 2 step (ticket 22, release 0.2.0).
#
# Presets never carry ``renamed_from``: a migration step ships this map and
# ``tetramark.schema.diff`` reuses its rename machinery (kind table, columns,
# core ``kind`` values).  Keys are the
# OLD kind names — they exist only in the live ledger, never in the loaded
# preset — and values are kinds of the v2 preset.
#
# The bacterial ``glycerol_pct`` aliquot field does not become a stock field
# through this map: the column did not exist on ``stock_bacterial``, so the
# planner adds it and the step copies the values from ``aliquot_bacterial``
# before dropping that table (see ``migrate.py``).
entity:
  construct: protein_construct
  strain: bacterial_strain
stock:
  bacterial: bacterial_glycerol
  pellet: bacterial_pellet
