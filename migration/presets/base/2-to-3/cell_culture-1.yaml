preset: cell_culture
version: 1
description: >-
  Eukaryotic cell lines and the material frozen or harvested from them: cryo
  vials and cell pellets (a pellet may also record a transient transfection or
  transduction with a plasmid). Included by the molbio and cellbio bundles.
  Adapted from BioManager (MIT).

include: [base, nucleic_acids]

kinds:
  cell_line:
    object: entity
    description: >-
      A eukaryotic cell line (e.g. HEK293T, CHO-K1); derived and stable lines
      point at the parent line through parental.
    mixins: [named_fields]
    fields:
      species:
        type: string
        length: 64
        description: Species of origin, e.g. Homo sapiens or Cricetulus griseus.
      cell_type:
        type: string
        length: 64
        description: Cell type or tissue of origin (e.g. epithelial, CHO-K1).
      source:
        type: string
        length: 128
        description: Where the line came from (ATCC, collaborator, lab stock).
      genotype:
        type: text
        description: Genotype / modifications / markers of the line.
      parental:
        type: ref
        to: cell_line
        lineage: true
        description: Parental line this line derives from (stable or derivative lines).

  cell_vial:
    object: stock
    statuses: cryo
    description: A cryovial of a cell line, with its passage and freezing medium.
    entity_kinds: [cell_line]
    fields:
      passage:
        type: int
        description: Passage number of the cells when the vial was frozen.
      medium:
        type: string
        length: 64
        description: Growth medium the line is kept in, e.g. DMEM + 10% FBS.
      freezing_medium:
        type: string
        length: 64
        description: Medium the vial was frozen in, e.g. 90% FBS + 10% DMSO.
      cells_per_vial:
        type: int
        description: Number of cells frozen per vial, when counted.
      dmso_pct:
        type: decimal
        precision: 5
        scale: 2
        default: 10
        description: DMSO concentration of the freezing mix, in percent.

  cell_pellet:
    object: stock
    statuses: tube
    description: >-
      A harvested cell pellet; a plasmid instead of a cell line records a
      transient-transfection / transduction harvest.
    entity_kinds: [cell_line, plasmid]
    fields:
      cell_count:
        type: int
        description: Number of cells harvested, when counted.
      passage:
        type: int
        description: Passage number of the cells when the pellet was harvested.
      transfection:
        type: string
        length: 128
        description: Transfection reagent/method or virus used, when applicable.
      harvested_on:
        type: date
        description: Date the cells were harvested (ISO yyyy-mm-dd).

rules:
  - id: MB05
    description: DMSO percentage of cell vials stays between 0 and 100
    severity: fail
    sql: >-
      SELECT COUNT(*) FROM stock_cell_vial
      WHERE dmso_pct IS NOT NULL AND (dmso_pct < 0 OR dmso_pct > 100)
    expect: {single_value: 0}
