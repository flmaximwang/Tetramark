[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tetramark"
version = "0.1.1"
description = "A general-purpose, version-controlled inventory ledger on Dolt"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pymysql>=1.1",
    "rich>=13.0",
]

[project.scripts]
tm = "tetramark.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tetramark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -n auto --dist loadfile"
markers = [
    "server: starts a real dolt sql-server on a random free port (slow; skip with -m 'not server')",
    "embedded: test deliberately runs against the embedded driver (no dolt sql-server)",
]
