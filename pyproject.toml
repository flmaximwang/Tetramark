[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doltledger"
version = "0.1.0"
description = "A general-purpose, version-controlled inventory ledger on Dolt"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pymysql>=1.1",
    "rich>=13.0",
]

[project.scripts]
ledger = "doltledger.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/doltledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
