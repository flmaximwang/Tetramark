[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tetramark"
version = "0.8.7"
description = "A general-purpose, version-controlled inventory ledger on Dolt"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "prompt-toolkit>=3.0.53",
]

[project.scripts]
tm = "tetramark.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.4",
    "pytest-xdist>=3.8.0",
    # Opt-in server backend (TETRAMARK_DRIVER=server): the driver imports this
    # lazily, so the embedded default install never needs it.
    "pymysql>=1.2.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tetramark"]

# P8: presets are repository data, not Python modules.  Ship the checkout's
# presets/ inside the installed package (<site-packages>/tetramark/presets) so a
# bare `--preset NAME` resolves from a wheel without $TETRAMARK_PRESETS_DIR.
[tool.hatch.build.targets.wheel.force-include]
"presets" = "tetramark/presets"

[tool.hatch.build.targets.sdist]
include = [
    "src/tetramark",
    "presets",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -n auto --dist worksteal"
# A hung dolt server or deadlocked fixture must fail the run, not stall it.
# A test that legitimately needs longer overrides this with
# @pytest.mark.timeout(<seconds>) and a comment explaining why.
timeout = 60
markers = [
    "embedded: test deliberately runs against the embedded driver (no dolt sql-server)",
    "embedded_driver: test pins the embedded driver's per-statement round trips; runs with TETRAMARK_DRIVER=embedded even when the session defaults to the server backend",
    "fast: Dolt-free unit test (no database, no dolt binary). Fast lane: `uv run pytest -q -m fast` (seconds); never put it on an integration test.",
]
