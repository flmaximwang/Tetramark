preset: molbio
version: 3
description: >-
  Molecular-biology inventory derived from the zsqlab08/zsqlab10 ledgers:
  protein constructs, plasmids, oligos, bacterial strains and cell lines, with
  their bacterial glycerol, plasmid-prep, protein-prep, oligo, pellet and cell
  stocks. A bundle: it has no kinds of its own and assembles the nucleic_acids,
  bacteria, proteins and cell_culture parts over base, so other presets can
  share them. Existing ledgers keep listing molbio.

# A bundle only includes parts.  nucleic_acids itself includes proteins (a
# plasmid points at its protein design) and base; listing every part here keeps
# the bundle self-describing and the loader loads each file once.
include: [base, nucleic_acids, bacteria, proteins, cell_culture]
